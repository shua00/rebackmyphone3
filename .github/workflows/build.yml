# ============================================================
# Build and validation pipeline — LAN P2P v2
# Android APK compilation is path-gated; docs/changelog-only commits
# do not start this workflow.
# ============================================================
name: Build APK

on:
  push:
    branches:
      - "main"
      - "master"
      - "feature/lan-p2p-v2-only"
    paths:
      # Android source and build inputs
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      # LAN Python implementation and its regression suite
      - "lan_p2p_core.py"
      - "rescue2.py"
      - "chat.py"
      - "server2.py"
      - "tests/**"
      # Pipeline changes themselves
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-android-changes:
    runs-on: ubuntu-latest
    outputs:
      build_apk: ${{ steps.detect.outputs.build_apk }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Android build inputs
        id: detect
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "build_apk=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "::warning::Previous push commit is unavailable; conservatively running the APK build."
            echo "build_apk=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" | grep -Eq '^(app/|build\.gradle$|settings\.gradle$|gradle\.properties$|gradle/|gradlew$|gradlew\.bat$)'; then
            echo "build_apk=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_apk=false" >> "$GITHUB_OUTPUT"
          fi

  validate-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Validate Python communication services
        run: |
          python3 -m py_compile server2.py rescue2.py chat.py lan_p2p_core.py
          python3 -m unittest discover -s tests -v

  build:
    needs: [detect-android-changes, validate-python]
    if: needs.detect-android-changes.outputs.build_apk == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
