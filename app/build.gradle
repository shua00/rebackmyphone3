plugins {
    id 'com.android.application'
}

// Diagnostics are enabled for development/acceptance builds by default.
// Release slimming: ./gradlew assembleRelease -PincludeDiagnostics=false
// CI verifies both variants; keep the opt-out build path free of diagnostics package classes.
def includeDiagnostics = providers.gradleProperty("includeDiagnostics")
        .map { it.toBoolean() }.getOrElse(true)

android {
    namespace 'com.example.devicefinder'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.devicefinder"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [diagnosticsEnabled: includeDiagnostics.toString()]
        buildConfigField "boolean", "DIAGNOSTICS_ENABLED", includeDiagnostics.toString()

        // ★ 自动生成格式为 YYYYMMDD-HHmm 的版本号（例如 20261110-1930）
        def buildTime = new java.text.SimpleDateFormat("yyyyMMdd-HHmm").format(new java.util.Date())
        buildConfigField "String", "AUTO_BUILD_VERSION", "\"${buildTime}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    sourceSets {
        main {
            // The diagnostic UI, probes, report/history stores and batch spool are optional.
            // The tiny LAN runtime-state bridge stays in core because TrackingService publishes
            // lifecycle snapshots through it; it has no UI, storage, worker or network behavior.
            if (!includeDiagnostics) {
                java.exclude 'com/example/devicefinder/diagnostics/**'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // ★ 必须开启这个选项，否则无法生成 BuildConfig.java 文件
    buildFeatures {
        buildConfig true
    }

    // Robolectric runs against the Android framework in the local JVM test task.
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            testLogging {
                events "failed"
                showStandardStreams = true
            }
        }
    }
}

dependencies {
    // Test-only dependencies: never packaged into the production APK.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
}
