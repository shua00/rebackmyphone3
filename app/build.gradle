plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.devicefinder'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.devicefinder"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // ★ 自动生成格式为 YYYYMMDD-HHmm 的版本号（例如 20261110-1930）
        def buildTime = new java.text.SimpleDateFormat("yyyyMMdd-HHmm").format(new java.util.Date())
        buildConfigField "String", "AUTO_BUILD_VERSION", "\"${buildTime}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // ★ 必须开启这个选项，否则无法生成 BuildConfig.java 文件
    buildFeatures {
        buildConfig true
    }

    // Robolectric runs against the Android framework in the local JVM test task.
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            testLogging {
                events "failed"
                showStandardStreams = true
            }
        }
    }
}

dependencies {
    // Test-only dependencies: never packaged into the production APK.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
}
